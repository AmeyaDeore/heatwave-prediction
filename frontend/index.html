<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Short-term heatwave risk, explanations and early warnings for disaster management officials."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Climate Intelligence</title>
    <script>
      // Apply the stored theme before first paint so dark mode never flashes light.
      // Mirrors src/state/theme.tsx (key "hw.theme").
      try {
        var t = JSON.parse(localStorage.getItem("hw.theme") || '"system"');
        var dark =
          t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Climate Intelligence needs JavaScript to show live heatwave data.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
