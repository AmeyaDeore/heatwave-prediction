[project]
name = "heatwave-api"
version = "0.1.0"
description = "FastAPI service for the AI Heatwave Prediction & Early Warning System"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx2>=2.13.1",
    "pyyaml>=6.0",
    "heatwave-ml",
]

[project.scripts]
heatwave-db = "heatwave_api.db.cli:main"

[tool.uv.sources]
heatwave-ml = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
